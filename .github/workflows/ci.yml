name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.2
            laravel: 10.*
            testbench: ^8.37
          - php: 8.3
            laravel: 10.*
            testbench: ^8.37
          - php: 8.2
            laravel: 11.*
            testbench: ^9.12
          - php: 8.3
            laravel: 11.*
            testbench: ^9.12
          - php: 8.4
            laravel: 11.*
            testbench: ^9.12
          - php: 8.2
            laravel: 12.*
            testbench: ^10.0
          - php: 8.3
            laravel: 12.*
            testbench: ^10.0
          - php: 8.4
            laravel: 12.*
            testbench: ^10.0

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          # Composer 2.10+ blocks older Laravel releases that still have advisories on Packagist.
          # CI still needs to verify this package against Laravel 10 and 11.
          composer config audit.block-insecure false
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/filesystem:${{ matrix.laravel }}" \
            "illuminate/view:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests
        run: vendor/bin/phpunit
